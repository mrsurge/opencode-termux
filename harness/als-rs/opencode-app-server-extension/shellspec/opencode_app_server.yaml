version: "1"
shells:
  opencode_app_server_observed:
    backend: pipe
    pipe:
      mode: native_pipe_testing
    cwd: ${ctx:CWD}
    subgroups: ["als-rs", "app_server", "opencode", "observed"]
    inspect_hints:
      - json
      - jsonrpc
    debug:
      io_metadata: true
      stdin_capture: preview
      stdin_preview_bytes: 240
    env:
      OPENCODE_DB: "opencode-dev.db"
      OPENCODE_DISABLE_AUTOUPDATE: "1"
      OPENCODE_DISABLE_AUTOCOMPACT: "1"
      OPENCODE_DISABLE_MODELS_FETCH: "1"
    command:
      - /data/data/com.termux/files/home/.bun/bin/bun
      - run
      - --conditions=browser
      - /data/data/com.termux/files/home/test-projects/opencode/packages/opencode/src/index.ts
      - app-server
    labels:
      app: "opencode-app-server-observed"
  opencode_app_server_debug:
    backend: pipe
    pipe:
      mode: native_pipe_testing
    debug:
      io_metadata: true
      stdin_capture: full
    cwd: ${ctx:CWD}
    subgroups: ["als-rs", "app_server", "opencode", "observed"]
    inspect_hints:
      - json
      - jsonrpc
    env:
      OPENCODE_DB: "opencode-dev.db"
      OPENCODE_DISABLE_AUTOUPDATE: "1"
      OPENCODE_DISABLE_AUTOCOMPACT: "1"
      OPENCODE_DISABLE_MODELS_FETCH: "1"
    command:
      - /data/data/com.termux/files/home/.bun/bin/bun
      - run
      - --conditions=browser
      - /data/data/com.termux/files/home/test-projects/opencode/packages/opencode/src/index.ts
      - app-server
    labels:
      app: "opencode-app-server-debug"
